<ion-app>
  <!-- Banner offline -->
  @if (!network.isOnline()) {
    <div class="offline-banner">
      <ion-icon name="cloud-offline-outline"></ion-icon>
      <span>Modo offline</span>
      <small>Los cambios se sincronizarán al reconectar</small>
    </div>
  }

  <!-- Side Menu -->
  <ion-menu contentId="main-content" type="overlay">
    <ion-header class="menu-header">
      <ion-toolbar>
        <div class="menu-brand">
          <div class="brand-icon">
            <ion-icon name="wallet-outline"></ion-icon>
          </div>
          <div>
            <strong>Contabilidad</strong>
            <span>Gestión financiera</span>
          </div>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <div class="menu-business">
        <div class="business-avatar">
          <ion-icon name="business-outline"></ion-icon>
        </div>
        <div class="business-info">
          <span>NEGOCIO ACTUAL</span>
          <h3>{{ selectedBusinessName }}</h3>
        </div>
        <ion-button
          fill="clear"
          class="change-business-button"
          (click)="changeBusiness()">
          <ion-icon slot="icon-only" name="swap-horizontal-outline"></ion-icon>
        </ion-button>
      </div>

      <ion-list lines="none" class="menu-list">
        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/dashboard" routerLinkActive="selected" detail="false">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/transactions" routerLinkActive="selected" detail="false">
            <ion-icon slot="start" name="list-outline"></ion-icon>
            <ion-label>Movimientos</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/categories" routerLinkActive="selected" detail="false">
            <ion-icon slot="start" name="pricetags-outline"></ion-icon>
            <ion-label>Categorías</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/reports" routerLinkActive="selected" detail="false">
            <ion-icon slot="start" name="bar-chart-outline"></ion-icon>
            <ion-label>Reportes</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/businesses" routerLinkActive="selected" detail="false">
            <ion-icon slot="start" name="business-outline"></ion-icon>
            <ion-label>Mis Negocios</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>

    <ion-footer class="menu-footer">
      <ion-toolbar>
        <ion-button expand="block" fill="clear" color="danger" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          Cerrar sesión
        </ion-button>
      </ion-toolbar>
    </ion-footer>
  </ion-menu>

  <!-- Main content -->
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
