<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo">
      <ion-icon name="wallet-outline" style="font-size: 64px; color: var(--ion-color-primary);"></ion-icon>
      <h1>Contabilidad</h1>
      <p>Multi-Negocio</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <ion-item>
        <ion-input
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          autocomplete="email">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          autocomplete="current-password">
        </ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="form.invalid || loading" class="ion-margin-top">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Entrar
        }
      </ion-button>
    </form>

    <div class="register-link ion-text-center ion-margin-top">
      <ion-text color="medium">¿No tienes cuenta?</ion-text>
      <ion-button fill="clear" routerLink="/register">
        Regístrate
      </ion-button>
    </div>
  </div>
</ion-content>
