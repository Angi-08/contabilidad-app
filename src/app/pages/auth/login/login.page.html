<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-page">
    <div class="auth-decoration auth-decoration-one"></div>
    <div class="auth-decoration auth-decoration-two"></div>

    <div class="auth-container">
      <div class="brand">
        <div class="brand-icon">
          <ion-icon name="wallet-outline"></ion-icon>
        </div>
        <div class="brand-name">
          <strong>Contabilidad</strong>
          <span>Gestión financiera</span>
        </div>
      </div>

      <div class="welcome">
        <span>BIENVENIDO</span>
        <h1>Inicia sesión</h1>
        <p>Administra tus negocios y controla tus finanzas desde un solo lugar.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="login()" class="auth-form">
        <div class="field">
          <label>Correo electrónico</label>
          <ion-item lines="none">
            <ion-icon slot="start" name="mail-outline"></ion-icon>
            <ion-input
              type="email"
              formControlName="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email">
            </ion-input>
          </ion-item>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <ion-item lines="none">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input
              type="password"
              formControlName="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password">
            </ion-input>
          </ion-item>
        </div>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="form.invalid || loading"
          class="btn-cta">
          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <span>Iniciar sesión</span>
            <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
          }
        </ion-button>
      </form>

      <div class="auth-switch">
        <span>¿Aún no tienes una cuenta?</span>
        <ion-button fill="clear" routerLink="/register">
          Crear cuenta
        </ion-button>
      </div>

      <div class="auth-footer">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <span>Tus datos están protegidos</span>
      </div>
    </div>
  </div>
</ion-content>
